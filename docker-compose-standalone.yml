# Lumina Standalone 单体模式部署
# 一条命令到登录页：LLM_API_KEY=sk-xxx docker compose -f docker-compose-standalone.yml up -d
# 仅 MySQL + Redis 两个外部依赖，无需 Nacos / RocketMQ / 独立 Gateway

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lumina-standalone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: lumina_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumina-standalone-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  lumina:
    build:
      # 构建上下文必须是项目根目录（standalone 编译依赖兄弟模块）
      context: .
      dockerfile: lumina-standalone/Dockerfile
    container_name: lumina-standalone
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lumina_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      LLM_API_KEY: ${LLM_API_KEY:?must set LLM_API_KEY}
      LLM_TYPE: ${LLM_TYPE:-dashscope}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LUMINA_JWT_SECRET: ${LUMINA_JWT_SECRET:-dev-only-secret-please-change-for-production-use-at-least-32-chars-standalone}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  redis_data:
