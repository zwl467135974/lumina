# Lumina CD - Docker 镜像构建与推送
# 触发：打 tag v* 或手动 dispatch
#
# 配置 Secrets 后才会推送镜像（否则只构建验证不推送）:
#   DOCKER_REGISTRY   - 镜像仓库地址（默认 registry.cn-hangzhou.aliyuncs.com）
#   DOCKER_NAMESPACE  - 命名空间（默认 lumina）
#   DOCKER_USERNAME   - 仓库用户名
#   DOCKER_PASSWORD   - 仓库密码/Token
name: Docker Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  NAMESPACE: ${{ secrets.DOCKER_NAMESPACE || 'lumina' }}

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          # 后端：构建上下文为根目录（多模块项目需要），通过 file 指定各模块 Dockerfile
          - name: gateway
            context: .
            file: ./lumina-gateway/Dockerfile
          - name: business-base
            context: .
            file: ./lumina-modules/lumina-business-base/Dockerfile
          - name: agent-service
            context: .
            file: ./lumina-modules/lumina-business-agent/Dockerfile
          # 前端：构建上下文为前端目录
          - name: frontend
            context: ./lumina-frontend
            file: ./lumina-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Registry Credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "✅ Docker 凭证已配置，将推送镜像"
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "⚠️ Docker 凭证未配置，只构建不推送（配置 DOCKER_USERNAME/DOCKER_PASSWORD secrets 后自动推送）"
          fi

      - name: Login to Registry
        if: steps.creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: ${{ steps.creds.outputs.has_creds == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.service.name }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
