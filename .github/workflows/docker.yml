# Lumina CD - Docker 镜像构建与推送
# 触发：打 tag v* 或手动 dispatch
# 注意：本文件为参考模板，需配置 DOCKER_REGISTRY / DOCKER_USERNAME / DOCKER_PASSWORD secrets
name: Docker Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  NAMESPACE: ${{ secrets.DOCKER_NAMESPACE || 'lumina' }}

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: gateway
            context: ./lumina-gateway
          - name: business-base
            context: ./lumina-modules/lumina-business-base
          - name: agent-service
            context: ./lumina-modules/lumina-business-agent
          - name: frontend
            context: ./lumina-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.service.name }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
