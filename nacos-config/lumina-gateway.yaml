# ============================================================
# Nacos Config — lumina-gateway
# Data ID: lumina-gateway.yaml
# Group:   LUMINA_GROUP
# Namespace: dev
# ============================================================

spring:
  main:
    allow-bean-definition-overriding: true

  # Redis 配置（Spring Boot 3.x 使用 spring.data.redis）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  cloud:
    gateway:
      routes:
        # Base 服务路由
        - id: lumina-base-auth-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/base/auth/**]
          filters: [StripPrefix=0]

        - id: lumina-base-users-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/base/users/**]
          filters: [StripPrefix=0]

        - id: lumina-base-roles-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/base/roles/**]
          filters: [StripPrefix=0]

        - id: lumina-base-permissions-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/base/permissions/**]
          filters: [StripPrefix=0]

        - id: lumina-base-tenants-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/base/tenants/**]
          filters: [StripPrefix=0]

        - id: lumina-base-audit-logs-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/audit-logs/**]
          filters: [StripPrefix=0]

        - id: lumina-base-fallback-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/base/**]
          filters: [StripPrefix=0]

        # Agent 服务路由
        - id: lumina-agent-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/agents/**]
          filters: [StripPrefix=0]

        - id: lumina-llm-providers-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/llm-providers/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-conversations-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/conversations/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-workflows-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/workflows/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-prompts-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/prompts/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-cost-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/cost/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-budget-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/budget/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-evaluations-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/evaluations/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-ab-tests-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/ab-tests/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-long-term-memories-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/long-term-memories/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-knowledge-bases-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/knowledge-bases/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-tools-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/tools/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-mcp-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/mcp/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-knowledge-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/knowledge/**]
          filters: [StripPrefix=0]

        - id: lumina-agent-files-route
          uri: lb://lumina-agent-service
          predicates: [Path=/api/v1/files/**]
          filters: [StripPrefix=0]

        # 通知中心路由（随 base 服务部署）
        - id: lumina-notification-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/notifications/**]
          filters: [StripPrefix=0]

        - id: lumina-auth-route
          uri: lb://lumina-business-base
          predicates: [Path=/api/v1/auth/**]
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/base/auth/${segment}

      default-filters:
        - name: JwtAuthentication
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET
            backoff:
              firstBackoff: 10ms
              maxBackoff: 50ms
              factor: 2
              basedOnPreviousValue: false

# Lumina 配置
lumina:
  jwt:
    secret-key: ${LUMINA_JWT_SECRET:dev-only-secret-please-change-for-production-use-at-least-32-chars}
    expiration: 604800000
  whitelist:
    paths:
      - /api/v1/auth/login
      - /api/v1/base/auth/login
      - /actuator/health
      - /actuator/info
  gateway:
    cors:
      # 生产环境务必改为实际前端域名，禁止通配符
      allowed-origins: ${LUMINA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    rate-limit:
      global: 100
      per-ip: 20

logging:
  level:
    org.springframework.cloud.gateway: INFO
    io.lumina: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
