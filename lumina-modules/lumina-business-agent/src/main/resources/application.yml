server:
  port: 8081

spring:
  application:
    name: lumina-agent-service
  main:
    allow-bean-definition-overriding: true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_GROUP:LUMINA_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_GROUP:LUMINA_GROUP}
        file-extension: yaml

  config:
    import: optional:nacos:lumina-agent-service.yaml

  # === 本地 fallback 配置（Nacos 不可用时使用） ===
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lumina_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_USERNAME:root}
      password: ${SPRING_DATASOURCE_PASSWORD:123456}
      initial-size: 5
      min-idle: 5
      max-active: 20

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  rocketmq:
    name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
    producer:
      group: lumina-producer
      send-message-timeout: 5000

rocketmq:
  consumer:
    knowledge-ingest:
      enabled: ${MQ_KNOWLEDGE_ASYNC:false}
    agent-task:
      enabled: ${MQ_AGENT_TASK_ASYNC:false}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: io.lumina.*.infrastructure.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

lumina:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-path: ${STORAGE_LOCAL_PATH:./data/files}
      url-prefix: /api/v1/files
  agent:
    content-moderation:
      enabled: ${CONTENT_MODERATION_ENABLED:true}
      strict: ${CONTENT_MODERATION_STRICT:false}
    llm:
      type: ${LLM_TYPE:dashscope}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:qwen-plus}
      base-url: ${LLM_BASE_URL:}
      temperature: ${LLM_TEMPERATURE:0.7}
      max-tokens: ${LLM_MAX_TOKENS:2000}
      stream: ${LLM_STREAM:false}
  rag:
    enabled: ${RAG_ENABLED:false}
    store-type: ${RAG_STORE_TYPE:memory}
    mode: ${RAG_MODE:generic}
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:dashscope}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      base-url: ${RAG_EMBEDDING_BASE_URL:}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
      dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    retrieve:
      limit: 3
      score-threshold: 0.3
    reader:
      chunk-size: 512
      overlap: 50
      split-strategy: PARAGRAPH
    qdrant:
      host: ${QDRANT_HOST:localhost:6334}
      collection: ${QDRANT_COLLECTION:lumina_knowledge}
      tls: ${QDRANT_TLS:false}

logging:
  level:
    io.lumina: DEBUG
    org.springframework: INFO
