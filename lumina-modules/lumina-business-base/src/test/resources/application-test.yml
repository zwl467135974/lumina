# 测试环境配置（CI + 本地集成测试，无 Nacos）
spring:
  main:
    allow-bean-definition-overriding: true

  # 禁用 RocketMQ autoconfiguration（测试环境无 MQ，避免 NotificationConsumer 触发连接）
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

  # 禁用 Nacos
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false

  # 数据源（CI 通过环境变量覆盖）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/lumina_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_USERNAME:root}
      password: ${SPRING_DATASOURCE_PASSWORD:123456}
      initial-size: 2
      min-idle: 2
      max-active: 8

  # Redis（CI 无密码，本地有密码）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  # Flyway 测试配置
  flyway:
    enabled: true
    encoding: UTF-8
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

# JWT（测试环境用固定密钥）
lumina:
  jwt:
    secret-key: test-secret-key-for-integration-test-must-be-at-least-32-chars-long
    expiration: 604800000
