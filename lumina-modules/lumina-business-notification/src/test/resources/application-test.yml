# 测试环境配置（notification 模块集成测试，无 Nacos/MQ，自包含建表）
spring:
  main:
    allow-bean-definition-overriding: true

  # 禁用 RocketMQ autoconfiguration（测试环境无 MQ，避免启动时连接 NameServer）
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

  # 禁用 Nacos
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false

  # 数据源（CI 通过环境变量覆盖）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lumina_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_USERNAME:root}
      password: ${SPRING_DATASOURCE_PASSWORD:123456}
      initial-size: 2
      min-idle: 2
      max-active: 10

  # Redis（NotificationSseRegistry 需 RedissonClient；本地/CI 通过环境变量覆盖）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}

  # Flyway（本模块 test/resources/db/migration 自包含建 lumina_notification 表）
  # validate-on-migrate=false：lumina_dev 已有 base 的 V2~V25 历史记录，而本模块 classpath 仅有 V900，
  # 关闭校验避免 "Detected applied migration not resolved locally" 错误，仅追加执行 V900。
  flyway:
    encoding: UTF-8
    out-of-order: true
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    locations: classpath:db/migration

# 禁用 RocketMQ（测试环境无 MQ，NotificationConsumer @ConditionalOnProperty matchIfMissing=true
# 默认注册，这里显式关闭避免容器初始化时尝试连接 NameServer）
rocketmq:
  name-server: localhost:9876
  consumer:
    notification:
      enabled: false

# MyBatis-Plus（仅 notification 包，mapper 由 framework 的 @MapperScan("io.lumina.*.infrastructure.mapper") 覆盖）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: io.lumina.notification.infrastructure.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 测试密钥
lumina:
  jwt:
    secret-key: test-secret-key-for-integration-test-at-least-32-chars-long
    expiration: 604800000
