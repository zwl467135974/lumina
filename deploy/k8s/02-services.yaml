            - { name: SPRING_PROFILES_ACTIVE, value: "k8s" }
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_ENABLED, value: "false" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
