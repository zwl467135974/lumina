# Gateway Deployment + Service + Ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lumina
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: lumina/gateway:latest  # 替换为实际镜像地址
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: lumina-config }
            - secretRef: { name: lumina-secrets }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "k8s" }
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_ENABLED, value: "false" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lumina
spec:
  selector: { app: gateway }
  ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumina-ingress
  namespace: lumina
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: lumina.example.com  # 替换为实际域名
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }

# Business Base Deployment
---
apiVersion: apps/v1
