apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumina.fullname" . }}-agent-service
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-service
spec:
  replicas: {{ .Values.agentService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-service
  template:
    metadata:
      labels:
        {{- include "lumina.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent-service
    spec:
      containers:
        - name: agent-service
          image: "{{ .Values.image.registry }}/{{ .Values.image.namespace }}/lumina-business-agent:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "lumina.fullname" . }}-config
            - secretRef:
                name: {{ include "lumina.fullname" . }}-secret
          resources:
            {{- toYaml .Values.agentService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumina.fullname" . }}-agent-service
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: agent-service
---
{{- if .Values.agentService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lumina.fullname" . }}-agent-service
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lumina.fullname" . }}-agent-service
  minReplicas: {{ .Values.agentService.hpa.minReplicas }}
  maxReplicas: {{ .Values.agentService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agentService.hpa.cpuUtilization }}
{{- end }}
