apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lumina.fullname" . }}-config
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://{{ include "lumina.fullname" . }}-mysql:3306/lumina_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_REDIS_HOST: "{{ include "lumina.fullname" . }}-redis"
  SPRING_REDIS_PORT: "6379"
  LLM_TYPE: {{ .Values.config.llmType | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_BASE_URL: {{ .Values.config.llmBaseUrl | quote }}
  RAG_ENABLED: {{ .Values.config.ragEnabled | quote }}
  RAG_STORE_TYPE: {{ .Values.config.ragStoreType | quote }}
  RAG_MODE: {{ .Values.config.ragMode | quote }}
  RAG_EMBEDDING_PROVIDER: {{ .Values.config.ragEmbeddingProvider | quote }}
  RAG_EMBEDDING_BASE_URL: {{ .Values.config.ragEmbeddingBaseUrl | quote }}
  RAG_EMBEDDING_MODEL: {{ .Values.config.ragEmbeddingModel | quote }}
  RAG_EMBEDDING_DIMENSIONS: {{ .Values.config.ragEmbeddingDimensions | quote }}
  OTEL_SAMPLING_PROBABILITY: {{ .Values.config.otelSamplingProbability | quote }}
  # 环境变量名必须与应用读取的 lumina.storage.* 占位符一致：
  # StorageProperties 读取 ${STORAGE_TYPE} / ${STORAGE_LOCAL_PATH}（非 LUMINA_ 前缀）
  STORAGE_TYPE: "local"
  STORAGE_LOCAL_PATH: "/app/data/files"
